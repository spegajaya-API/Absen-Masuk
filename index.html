<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Online - Spegajaya</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #06b6d4;
      --text-color: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1, h2 {
      text-align: center;
      color: var(--accent-color);
    }
    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .flex-gap {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 15px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      background-color: #334155;
      color: var(--text-color);
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-class.active {
      background-color: var(--accent-color);
      color: #000;
    }
    .student-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .student-name {
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-absen { background-color: #10b981; color: white; }
    .btn-sakit { background-color: #f59e0b; color: white; }
    .btn-ijin { background-color: #3b82f6; color: white; }
    .btn-alpa { background-color: #ef4444; color: white; }
    .btn:disabled, .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    select, input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text-color);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #0f172a;
      color: var(--accent-color);
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      gap: 10px;
    }
    .tab-btn {
      padding: 10px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
    }
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PRESENSI ONLINE SPEGAJAYA</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('input-view', this)">Input Absensi</button>
      <button class="tab-btn" onclick="switchTab('rekap-view', this)">Rekap Data</button>
    </div>

    <!-- TAMPILAN INPUT ABSENSI -->
    <div id="input-view" class="view-section active">
      <div class="card">
        <h3>Pilih Kelas:</h3>
        <div class="flex-gap" id="class-buttons">
          <button class="btn btn-class" onclick="selectClass('7a', this)">7a</button>
          <button class="btn btn-class" onclick="selectClass('8a', this)">8a</button>
          <button class="btn btn-class" onclick="selectClass('8b', this)">8b</button>
          <button class="btn btn-class" onclick="selectClass('9a', this)">9a</button>
          <button class="btn btn-class" onclick="selectClass('9b', this)">9b</button>
        </div>
      </div>

      <div class="card">
        <h3 id="class-title">Daftar Siswa</h3>
        <div id="student-list">
          <p style="text-align: center; color: var(--text-dim);">Silakan pilih kelas di atas terlebih dahulu.</p>
        </div>
      </div>
    </div>

    <!-- TAMPILAN REKAP DATA -->
    <div id="rekap-view" class="view-section">
      <div class="card">
        <h3>Filter Rekap Data</h3>
        <div class="flex-gap" style="justify-content: flex-start; align-items: center;">
          <label>Kelas:</label>
          <select id="rekap-kelas">
            <option value="7a">7a</option>
            <option value="8a">8a</option>
            <option value="8b">8b</option>
            <option value="9a">9a</option>
            <option value="9b">9b</option>
          </select>

          <label>Tipe:</label>
          <select id="rekap-tipe" onchange="toggleSiswaOption()">
            <option value="kelas">Rekap Kelas</option>
            <option value="individu">Rekap Individu</option>
          </select>

          <div id="siswa-select-wrapper" style="display: none;">
            <label>Siswa:</label>
            <select id="rekap-siswa"></select>
          </div>

          <button class="btn" style="background-color: var(--accent-color); color: #000;" onclick="loadRekapData()">Tampilkan Rekap</button>
        </div>
      </div>

      <div class="card" id="rekap-result-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Hasil Rekapitulasi</h3>
          <button class="btn" style="background-color: #10b981; color: white;" onclick="window.print()">Cetak / Simpan PDF</button>
        </div>
        <div id="rekap-table-wrapper"></div>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrFp1avAVxLYJt4rPriPg5DNcEgetWmxouu9IppKPThM-oHv5WQfmiuf_qO0zTnrllAQ/exec";

    let dataSiswa = [];
    let currentClass = "";

    // Inisialisasi Ambil Data Siswa saat halaman dimuat
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${SCRIPT_URL}?action=getSiswa`)
        .then(res => res.json())
        .then(data => {
          dataSiswa = data;
          console.log("Data siswa berhasil dimuat:", dataSiswa.length, "baris");
        })
        .catch(err => {
          console.error("Gagal memuat data siswa:", err);
          alert("Gagal mengambil data siswa dari server. Pastikan URL Apps Script sudah benar.");
        });
    });

    function switchTab(viewId, btn) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
    }

    function selectClass(kelas, btn) {
      currentClass = kelas;
      document.querySelectorAll('.btn-class').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('class-title').innerText = `Daftar Siswa Kelas ${kelas.toUpperCase()}`;

      const listContainer = document.getElementById('student-list');
      listContainer.innerHTML = "";

      // Filter siswa berdasarkan Kolom A (Index 0)
      const filtered = dataSiswa.filter(s => s[0] && s[0].toString().trim().toLowerCase() === kelas.toLowerCase());

      if (filtered.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center;'>Data siswa kelas ini tidak ditemukan atau data belum siap.</p>";
        return;
      }

      filtered.forEach(siswa => {
        const nama = siswa[1]; // Kolom B: Nama
        const noWa = siswa[2] ? siswa[2].toString().trim() : ""; // Kolom C: No WA
        const todayStr = new Date().toISOString().split('T')[0];
        const studentKey = `absen_${todayStr}_${kelas}_${nama.replace(/\s+/g, '_')}`;
        const savedStatus = localStorage.getItem(studentKey);

        const card = document.createElement('div');
        card.className = 'student-card';

        let buttonsHTML = '';
        if (savedStatus) {
          buttonsHTML = `<button class="btn-action" disabled>${savedStatus}</button>`;
        } else {
          buttonsHTML = `
            <button class="btn-action btn-absen" onclick="prosesAbsen('${nama}', '${noWa}', 'absen', this)">Absen</button>
            <button class="btn-action btn-sakit" onclick="prosesAbsen('${nama}', '${noWa}', 'Sakit', this)">Sakit</button>
            <button class="btn-action btn-ijin" onclick="prosesAbsen('${nama}', '${noWa}', 'Ijin', this)">Ijin</button>
            <button class="btn-action btn-alpa" onclick="prosesAbsen('${nama}', '${noWa}', 'Alpa', this)">Alpa</button>
          `;
        }

        card.innerHTML = `
          <div class="student-name">${nama}</div>
          <div class="action-buttons">${buttonsHTML}</div>
        `;
        listContainer.appendChild(card);
      });
    }

    function prosesAbsen(nama, noWa, tipe, btnElement) {
      const now = new Date();
      const jamStr = now.toTimeString().split(' ')[0].substring(0, 5);
      const tanggalStr = now.toISOString().split('T')[0];
      let statusFinal = tipe;

      if (tipe === 'absen') {
        const jam = now.getHours();
        if (jam < 7) {
          statusFinal = "Hadir Tepat Waktu";
        } else {
          statusFinal = "Hadir Terlambat";
        }
      }

      // Kunci UI
      const parentCard = btnElement.closest('.action-buttons');
      parentCard.innerHTML = `<button class="btn-action" disabled>${statusFinal}</button>`;

      const studentKey = `absen_${tanggalStr}_${currentClass}_${nama.replace(/\s+/g, '_')}`;
      localStorage.setItem(studentKey, statusFinal);

      const payload = {
        action: "absen",
        kelas: currentClass,
        nama: nama,
        noWa: noWa,
        status: statusFinal,
        tanggal: tanggalStr,
        jam: jamStr
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        console.log("Absen tersimpan & WA diproses:", res);
      })
      .catch(err => console.error("Gagal menyimpan data:", err));
    }

    function toggleSiswaOption() {
      const tipe = document.getElementById('rekap-tipe').value;
      const wrapper = document.getElementById('siswa-select-wrapper');
      if (tipe === 'individu') {
        wrapper.style.display = 'block';
        populateSiswaDropdown();
      } else {
        wrapper.style.display = 'none';
      }
    }

    function populateSiswaDropdown() {
      const kelas = document.getElementById('rekap-kelas').value;
      const selectSiswa = document.getElementById('rekap-siswa');
      selectSiswa.innerHTML = "";

      const filtered = dataSiswa.filter(s => s[0] && s[0].toString().trim().toLowerCase() === kelas.toLowerCase());
      filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s[1];
        opt.innerText = s[1];
        selectSiswa.appendChild(opt);
      });
    }

    function loadRekapData() {
      const kelas = document.getElementById('rekap-kelas').value;
      const tipe = document.getElementById('rekap-tipe').value;
      const namaSiswa = document.getElementById('rekap-siswa').value;

      fetch(`${SCRIPT_URL}?action=getRekap`)
        .then(res => res.json())
        .then(data => {
          let filteredData = data.filter(d => d[2] && d[2].toString().toLowerCase() === kelas.toLowerCase());
          
          if (tipe === 'individu') {
            filteredData = filteredData.filter(d => d[3] === namaSiswa);
          }

          renderRekapTable(filteredData);
        })
        .catch(err => {
          alert("Gagal mengambil data rekap dari server.");
          console.error(err);
        });
    }

    function renderRekapTable(data) {
      const wrapper = document.getElementById('rekap-table-wrapper');
      document.getElementById('rekap-result-card').style.display = 'block';

      if (data.length === 0) {
        wrapper.innerHTML = "<p style='text-align:center;'>Belum ada data rekap presensi.</p>";
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Jam</th>
              <th>Kelas</th>
              <th>Nama</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(row => {
        html += `
          <tr>
            <td>${row[0] || '-'}</td>
            <td>${row[1] || '-'}</td>
            <td>${row[2] || '-'}</td>
            <td>${row[3] || '-'}</td>
            <td><strong>${row[4] || '-'}</strong></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      wrapper.innerHTML = html;
    }
  </script>
</body>
</html>
