<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Online Pagi - UPT SMPN 3 Sutojayan</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary-cyan: #06b6d4;
      --accent-glow: #38bdf8;
      --btn-hadir: #10b981;
      --btn-sakit: #f59e0b;
      --btn-ijin: #3b82f6;
      --btn-alpa: #ef4444;
      --btn-disabled: #475569;
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', 'Roboto', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: var(--primary-cyan);
      text-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
      letter-spacing: 1px;
    }

    h2 {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-top: 5px;
      font-weight: 500;
    }

    .nav-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
    }

    .btn-nav {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.2);
    }

    .btn-nav:hover {
      background: var(--primary-cyan);
      color: #0f172a;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .class-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      width: 100%;
      max-width: 800px;
    }

    .btn-class {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .btn-class.active, .btn-class:hover {
      border-color: var(--primary-cyan);
      background: rgba(6, 182, 212, 0.2);
      color: #fff;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      flex-grow: 1;
    }

    .student-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      margin-bottom: 12px;
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid var(--primary-cyan);
      border-radius: 6px;
    }

    .student-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-absen { background-color: var(--btn-hadir); }
    .btn-sakit { background-color: var(--btn-sakit); }
    .btn-ijin { background-color: var(--btn-ijin); }
    .btn-alpa { background-color: var(--btn-alpa); }

    .btn-action:hover { opacity: 0.85; }

    .btn-action:disabled {
      background-color: var(--btn-disabled) !important;
      cursor: not-allowed;
      opacity: 0.6;
      box-shadow: none;
    }

    /* Modal / Section Rekap */
    .rekap-section {
      display: none;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--primary-cyan);
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.9rem;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .student-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .action-buttons {
        width: 100%;
        justify-content: space-between;
      }
      .btn-action {
        flex: 1;
        text-align: center;
        padding: 8px 4px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Presensi Online Pagi</h1>
    <h2>UPT SMP Negeri 3 Sutojayan</h2>
  </header>

  <div class="nav-bar">
    <button class="btn-nav" onclick="showHome()">🏠 Home</button>
    <button class="btn-nav" onclick="showRekap()">📊 Rekap Absen</button>
  </div>

  <!-- HALAMAN UTAMA (PRESENSI) -->
  <div id="home-page" style="width: 100%; max-width: 800px;">
    <div class="class-selector">
      <button class="btn-class" onclick="selectClass('7a', this)">Kelas 7a</button>
      <button class="btn-class" onclick="selectClass('8a', this)">Kelas 8a</button>
      <button class="btn-class" onclick="selectClass('8b', this)">Kelas 8b</button>
      <button class="btn-class" onclick="selectClass('9a', this)">Kelas 9a</button>
      <button class="btn-class" onclick="selectClass('9b', this)">Kelas 9b</button>
    </div>

    <div class="container" id="student-list">
      <p style="text-align: center; color: #94a3b8;">Silakan pilih kelas terlebih dahulu.</p>
    </div>
  </div>

  <!-- HALAMAN REKAP -->
  <div id="rekap-page" class="container rekap-section">
    <h3 style="color: var(--primary-cyan); margin-bottom: 15px;">Menu Rekapitulasi Presensi</h3>
    
    <div class="form-group">
      <label>Rentang Waktu Rekap:</label>
      <div style="display: flex; gap: 10px;">
        <input type="date" id="tgl-mulai">
        <input type="date" id="tgl-selesai">
      </div>
    </div>

    <div class="form-group">
      <label>Pilih Kelas yang Direkap:</label>
      <select id="rekap-kelas" onchange="toggleRekapOption()">
        <option value="">-- Pilih Kelas --</option>
        <option value="7a">Kelas 7a</option>
        <option value="8a">Kelas 8a</option>
        <option value="8b">Kelas 8b</option>
        <option value="9a">Kelas 9a</option>
        <option value="9b">Kelas 9b</option>
      </select>
    </div>

    <div id="sub-rekap-option" style="display: none;" class="form-group">
      <label>Tipe Rekap:</label>
      <div style="display: flex; gap: 10px;">
        <button class="btn-nav" style="flex:1;" onclick="tampilkanRekap('kelas')">Rekap Kelas</button>
        <button class="btn-nav" style="flex:1;" onclick="tampilkanRekap('individu')">Rekap Individu</button>
      </div>
    </div>

    <div id="rekap-siswa-dropdown" class="form-group" style="display: none;">
      <label>Pilih Siswa:</label>
      <select id="select-siswa"></select>
    </div>

    <div id="rekap-result" style="margin-top: 20px;"></div>
  </div>

  <footer>
    &copy; 2026 Azizah, S.Pd. All Rights Reserved.
  </footer>

  <script>
    // GANTI URL DI BAWAH DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrFp1avAVxLYJt4rPriPg5DNcEgetWmxouu9IppKPThM-oHv5WQfmiuf_qO0zTnrllAQ/exec";

    let dataSiswa = [];
    let currentClass = "";

    // Inisialisasi Data
    window.onload = function() {
      checkAndResetDailyData();
      fetchSiswa();
    };

    function checkAndResetDailyData() {
      const today = new Date().toISOString().split('T')[0];
      const lastReset = localStorage.getItem('lastResetDate');
      
      if (lastReset !== today) {
        localStorage.clear();
        localStorage.setItem('lastResetDate', today);
      }
    }

    function fetchSiswa() {
      fetch(`${SCRIPT_URL}?action=getSiswa`)
        .then(res => res.json())
        .then(data => {
          dataSiswa = data;
        })
        .catch(err => console.error("Gagal mengambil data:", err));
    }

    function showHome() {
      document.getElementById('home-page').style.display = 'block';
      document.getElementById('rekap-page').style.display = 'none';
    }

    function showRekap() {
      document.getElementById('home-page').style.display = 'none';
      document.getElementById('rekap-page').style.display = 'block';
    }

    function selectClass(kelas, btn) {
      currentClass = kelas;
      document.querySelectorAll('.btn-class').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const listContainer = document.getElementById('student-list');
      listContainer.innerHTML = "";

      const filtered = dataSiswa.filter(s => s[0].toString().toLowerCase() === kelas.toLowerCase());

      if (filtered.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center;'>Data siswa tidak ditemukan / sedang dimuat...</p>";
        return;
      }

      filtered.forEach(siswa => {
        const nama = siswa[1];
        const noWa = siswa[2];
        const studentId = `status_${kelas}_${nama.replace(/\s+/g, '_')}`;
        const savedStatus = localStorage.getItem(studentId);

        const card = document.createElement('div');
        card.className = 'student-card';

        let buttonsHTML = '';
        if (savedStatus) {
          buttonsHTML = `<button class="btn-action" disabled>${savedStatus}</button>`;
        } else {
          buttonsHTML = `
            <button class="btn-action btn-absen" onclick="prosesAbsen('${nama}', '${noWa}', 'absen', this)">Absen</button>
            <button class="btn-action btn-sakit" onclick="prosesAbsen('${nama}', '${noWa}', 'Sakit', this)">Sakit</button>
            <button class="btn-action btn-ijin" onclick="prosesAbsen('${nama}', '${noWa}', 'Ijin', this)">Ijin</button>
            <button class="btn-action btn-alpa" onclick="prosesAbsen('${nama}', '${noWa}', 'Alpa', this)">Alpa</button>
          `;
        }

        card.innerHTML = `
          <div class="student-name">${nama}</div>
          <div class="action-buttons">${buttonsHTML}</div>
        `;
        listContainer.appendChild(card);
      });
    }

    function prosesAbsen(nama, noWa, tipe, btnElement) {
      const now = new Date();
      const jamStr = now.toTimeString().split(' ')[0].substring(0, 5);
      const tanggalStr = now.toISOString().split('T')[0];
      let statusFinal = tipe;

      if (tipe === 'absen') {
        const jam = now.getHours();
        if (jam < 7) {
          statusFinal = "Hadir Tepat Waktu";
        } else {
          statusFinal = "Hadir Terlambat";
        }
      }

      // Nonaktifkan tombol di UI
      const parentCard = btnElement.closest('.action-buttons');
      parentCard.innerHTML = `<button class="btn-action" disabled>${statusFinal}</button>`;

      // Simpan status lokal agar terikat hari ini
      const studentId = `status_${currentClass}_${nama.replace(/\s+/g, '_')}`;
      localStorage.setItem(studentId, statusFinal);

      // Kirim data ke Google Sheets & Fonnte
      const payload = {
        action: "absen",
        kelas: currentClass,
        nama: nama,
        noWa: noWa,
        status: statusFinal,
        tanggal: tanggalStr,
        jam: jamStr
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => console.log("Absen tercatat:", res))
      .catch(err => console.error("Gagal menyimpan absen:", err));
    }

    function toggleRekapOption() {
      const kelas = document.getElementById('rekap-kelas').value;
      const subOpt = document.getElementById('sub-rekap-option');
      if (kelas) {
        subOpt.style.display = 'block';
      } else {
        subOpt.style.display = 'none';
        document.getElementById('rekap-siswa-dropdown').style.display = 'none';
      }
    }

    function tampilkanRekap(tipe) {
      const kelas = document.getElementById('rekap-kelas').value;
      const resultDiv = document.getElementById('rekap-result');

      if (tipe === 'individu') {
        const selectSiswa = document.getElementById('select-siswa');
        selectSiswa.innerHTML = "";
        const filtered = dataSiswa.filter(s => s[0].toString().toLowerCase() === kelas.toLowerCase());
        filtered.forEach(s => {
          selectSiswa.innerHTML += `<option value="${s[1]}">${s[1]}</option>`;
        });
        document.getElementById('rekap-siswa-dropdown').style.display = 'block';
        resultDiv.innerHTML = `<p style="color:var(--primary-cyan);">Menampilkan opsi rekap individu untuk kelas ${kelas.toUpperCase()}. Klik tombol lagi setelah memilih siswa.</p>`;
      } else {
        document.getElementById('rekap-siswa-dropdown').style.display = 'none';
        resultDiv.innerHTML = `<p style="color:var(--primary-cyan);">Memuat data rekap kelas ${kelas.toUpperCase()}...</p>`;
      }
    }
  </script>
</body>
</html>
